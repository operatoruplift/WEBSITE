[package]
name = "uplift-escrow"
version = "0.1.0"
description = "Operator Uplift commitment-staking escrow: stake USDC, prove daily, finishers reclaim their stake plus a share of forfeited stakes plus accrued yield."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "uplift_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
